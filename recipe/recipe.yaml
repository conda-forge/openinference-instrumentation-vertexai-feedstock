schema_version: 1

context:
  name: openinference-instrumentation-vertexai
  version: "0.1.24"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/openinference_instrumentation_vertexai-${{ version }}.tar.gz
  sha256: dafbe341279b32b316bf2caba885953b8ee7cfd7e4c243b52b598fdaa2ccfd74

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api
    - opentelemetry-instrumentation
    - opentelemetry-semantic-conventions
    - openinference-instrumentation >=0.1.7
    - openinference-semantic-conventions
    - wrapt

tests:
  - python:
      imports:
        - openinference.instrumentation.vertexai
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: OpenInference VertexAI Instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Arize-ai/openinference

extra:
  recipe-maintainers:
    - RogerHYang

