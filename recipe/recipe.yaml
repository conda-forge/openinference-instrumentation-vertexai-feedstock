schema_version: 1

context:
  version: "0.1.40"
  build_number: "0"

package:
  name: openinference-instrumentation-vertexai
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/openinference-instrumentation-vertexai/openinference_instrumentation_vertexai-${{ version }}.tar.gz
  sha256: 3fea61ffd94060f394b510bbea77a167631c05a81fb61bbe5f173a660d248a8b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api
    - opentelemetry-instrumentation
    - opentelemetry-semantic-conventions >=0.1.46
    - openinference-instrumentation >=0.1.82
    - openinference-semantic-conventions
    - wrapt

tests:
  - python:
      imports:
        - openinference.instrumentation.vertexai
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: OpenInference VertexAI Instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Arize-ai/openinference

extra:
  recipe-maintainers:
    - RogerHYang
    - jsmolic
